services:
  sim:
    image: ros2-humble-turtlebot3-sim:latest
    container_name: sim
    privileged: true
    shm_size: "1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    ports:
      - "2202:22"
    # 挂载本地工作区（取消注释并修改路径）
    # volumes:
    #   - /path/to/your/ws:/root/ws
    command: bash -c "service ssh start && /bin/bash"
    stdin_open: true
    tty: true
    restart: "no"
